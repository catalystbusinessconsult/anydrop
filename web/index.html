<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Anydrop</title>
    <style>
      /*
        Critical, self-contained styles for the boot splash below — it has
        to render correctly before styles.css (loaded as part of the app
        bundle) has a chance to arrive, so it can't depend on it. React
        replaces #root's contents wholesale on mount, so this markup just
        disappears once the app takes over — no cleanup script needed.
      */
      html,
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b1120;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #boot-splash .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 1.6rem;
        color: #04121f;
        background: linear-gradient(135deg, #38bdf8, #a78bfa);
        box-shadow: 0 6px 24px rgba(56, 189, 248, 0.35);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot-splash .name {
        color: #f1f5f9;
        font-weight: 700;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
      }
      #boot-splash .hint {
        color: #64748b;
        font-size: 0.82rem;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.08);
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="mark" aria-hidden="true">⇄</div>
        <div class="name">Anydrop</div>
        <div class="hint">Starting up…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
